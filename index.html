<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이미지 프롬프트 갤러리</title>
<meta name="author" content="도지마의 유부남 (@dadofdojima)">
<meta name="description" content="같은 프롬프트로 Gemini와 GPT가 그린 이미지를 나란히 보고, 프롬프트 전문을 가져갈 수 있는 갤러리">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
:root {
  --paper: #F3F0E8;
  --paper-deep: #EAE6DC;
  --ink: #161513;
  --ink-soft: #3A3833;
  --muted: #6B675F;
  --rule: #D9D4C8;
  --accent: #B4532A;
  --serif: Hahmlet, serif;
  --sans: Pretendard, system-ui, sans-serif;
  --mono: "IBM Plex Mono", monospace;
  --gutter: clamp(20px, 4vw, 56px);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; font-family: var(--sans); }
a { color: var(--ink); text-decoration: none; }
a:hover { color: var(--accent); }
::selection { background: var(--ink); color: var(--paper); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 20px var(--gutter);
  border-bottom: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.topbar a { display: flex; gap: 8px; align-items: center; }
.topbar a span:first-child { color: var(--muted); }

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 32px 64px;
  align-items: end;
  padding: clamp(48px, 8vw, 112px) var(--gutter) 40px;
}
@media (min-width: 900px) {
  .hero { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
}
.hero h1 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(40px, 6.4vw, 96px);
  line-height: 1.02;
  letter-spacing: -0.03em;
  white-space: nowrap;
}
.hero-side { display: flex; flex-direction: column; gap: 20px; max-width: 440px; }
.hero-side p { margin: 0; font-size: 16px; line-height: 1.7; color: var(--ink-soft); text-wrap: pretty; word-break: keep-all; }
.credit { font-size: 13px; color: var(--muted); }
.credit a { border-bottom: 1px solid #B9B3A6; }

.bar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 14px var(--gutter);
  background: rgba(243, 240, 232, 0.92);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.bar-left { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; }
.bar-left .toggle + .bar-label { margin-left: 10px; }
.bar-label { font-size: 13px; color: var(--muted); }
.toggle { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--ink); border-radius: 999px; }
.toggle button {
  padding: 7px 18px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--ink);
  background: transparent;
  border: 0;
  border-radius: 999px;
  cursor: pointer;
}
.toggle button[data-order], .toggle button[data-version] { padding: 7px 14px; font-family: var(--sans); font-size: 13px; letter-spacing: 0; }
.toggle button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.count { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; color: var(--muted); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 48px 24px;
  margin: 0;
  padding: 40px var(--gutter) 120px;
  list-style: none;
}
.card {
  all: unset;
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  cursor: pointer;
}
.card:hover { opacity: 0.86; }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.card img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  background: var(--paper-deep);
}
.card-text { display: flex; gap: 14px; align-items: baseline; }
.card-no { flex: none; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.card-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card-title { font-family: var(--serif); font-size: 19px; line-height: 1.3; letter-spacing: -0.01em; word-break: keep-all; }
.card-desc {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  font-size: 13px;
  line-height: 1.5;
  color: var(--muted);
  word-break: keep-all;
}

.foot {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  padding: 28px var(--gutter);
  border-top: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--muted);
}

/* 크게 보기 */
dialog {
  width: 100vw;
  max-width: none;
  height: 100dvh;
  max-height: none;
  margin: 0;
  padding: clamp(0px, 3vw, 40px);
  color: var(--ink);
  background: transparent;
  border: 0;
  overflow: hidden;
}
dialog[open] { display: flex; justify-content: center; align-items: stretch; }
dialog::backdrop { background: rgba(22, 21, 19, 0.72); backdrop-filter: blur(4px); }
.sheet { display: flex; flex-direction: column; width: 100%; max-width: 1240px; min-height: 0; background: var(--paper); }
/* 그림은 고정하고 프롬프트 전문만 스크롤한다 */
.sheet-body {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(0, 1.7fr) minmax(0, 1fr);
  min-height: 0;
}
.sheet-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--rule);
}
.sheet-title { display: flex; gap: 16px; align-items: baseline; min-width: 0; }
.sheet-title span { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.sheet-title h2 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 22px; letter-spacing: -0.01em; word-break: keep-all; }
.pill {
  flex: none;
  padding: 8px 16px;
  font-family: inherit;
  font-size: 13px;
  white-space: nowrap;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--ink);
  border-radius: 999px;
  cursor: pointer;
}
.pill:hover { background: var(--ink); color: var(--paper); }
.pill.solid { color: var(--paper); background: var(--ink); }
.pill.solid.done { background: var(--accent); border-color: var(--accent); }
.pair {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: minmax(0, 1fr);
  gap: 1px;
  min-height: 0;
  background: var(--rule);
  border-bottom: 1px solid var(--rule);
}
.pair.single { grid-template-columns: minmax(0, 1fr); }
.pair figure[hidden] { display: none; }
.pair figure { display: flex; flex-direction: column; gap: 12px; min-height: 0; margin: 0; padding: 20px 24px 24px; background: var(--paper); }
.pair figcaption { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; }
.pair img { display: block; flex: 1; width: 100%; min-height: 0; object-fit: contain; }
.prompt { display: flex; flex-direction: column; gap: 14px; min-height: 0; padding: 24px; }
.prompt-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
.prompt-head > span { font-size: 13px; color: var(--muted); }
.prompt-title { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; font-size: 13px; color: var(--muted); }
.prompt-title .toggle[hidden] { display: none; }
.prompt-actions { display: flex; align-items: center; gap: 16px; }
.prompt-actions a { font-size: 13px; border-bottom: 1px solid #B9B3A6; }
.prompt pre {
  margin: 0;
  padding: 20px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.75;
  white-space: pre-wrap;
  word-break: break-word;
  color: #2A2925;
  background: var(--paper-deep);
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}
.step { display: flex; justify-content: space-between; border-top: 1px solid var(--rule); }
.step button {
  flex: 1;
  padding: 18px 24px;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  background: transparent;
  border: 0;
  cursor: pointer;
}
.step button:hover { background: var(--paper-deep); }
.step button:first-child { text-align: left; border-right: 1px solid var(--rule); }
.step button:last-child { text-align: right; }

@media (max-width: 600px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 32px 14px; }
  .card-text { flex-direction: column; gap: 4px; }
  .card-title { font-size: 16px; }
  .bar-label { display: none; }
  .bar-left .toggle + .bar-label { margin-left: 0; }
  .count { display: none; }
  .sheet-head, .prompt { padding-left: 16px; padding-right: 16px; }
}
@media (max-width: 900px) {
  .sheet-body { grid-template-rows: 44% minmax(0, 1fr); }
  .pair figure { gap: 8px; padding: 12px 16px 16px; }
  .prompt { padding-top: 16px; padding-bottom: 16px; }
}
</style>
</head>
<body>
<header class="topbar">
  <span>Image Prompt Gallery</span>
  <a href="https://x.com/dadofdojima"><span>by</span><span>@dadofdojima</span></a>
</header>

<section class="hero">
  <h1>이미지 프롬프트<br>갤러리</h1>
  <div class="hero-side">
    <p>같은 프롬프트를 Gemini와 GPT에 넣어 얻은 결과를 모았습니다. 그림을 누르면 두 결과를 나란히 보고 프롬프트 전문을 가져갈 수 있습니다.</p>
    <div class="credit">도지마의 유부남 · 출처 <a href="https://x.com/dadofdojima">@dadofdojima</a></div>
  </div>
</section>

<div class="bar">
  <div class="bar-left">
    <span class="bar-label" id="toggle-label">목록에 보여줄 결과</span>
    <div class="toggle" role="group" aria-labelledby="toggle-label">
      <button type="button" data-model="gpt" aria-pressed="true">GPT</button>
      <button type="button" data-model="gemini" aria-pressed="false">Gemini</button>
    </div>
    <span class="bar-label" id="order-label">정렬</span>
    <div class="toggle" role="group" aria-labelledby="order-label">
      <button type="button" data-order="new" aria-pressed="true">최신순</button>
      <button type="button" data-order="old" aria-pressed="false">오래된순</button>
      <button type="button" data-order="name" aria-pressed="false">가나다순</button>
    </div>
  </div>
  <span class="count" id="count"></span>
</div>

<main>
  <ul class="grid" id="grid"></ul>
</main>

<footer class="foot">
  <span>Same prompt — GPT / Gemini</span>
  <span>© 도지마의 유부남</span>
</footer>

<dialog id="viewer" aria-labelledby="viewer-title">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title">
        <span id="viewer-no"></span>
        <h2 id="viewer-title"></h2>
      </div>
      <button class="pill" id="viewer-close" type="button">닫기</button>
    </div>
    <div class="sheet-body">
    <div class="pair">
      <figure><figcaption>GPT</figcaption><img id="viewer-gpt" alt=""></figure>
      <figure><figcaption>Gemini</figcaption><img id="viewer-gemini" alt=""></figure>
    </div>
    <div class="prompt">
      <div class="prompt-head">
        <div class="prompt-title">
          <span id="versions-label">프롬프트 전문</span>
          <div class="toggle" id="viewer-versions" role="group" aria-labelledby="versions-label" hidden></div>
        </div>
        <div class="prompt-actions">
          <a id="viewer-link" href="#">해설 문서 보기</a>
          <button class="pill solid" id="viewer-copy" type="button">프롬프트 복사</button>
        </div>
      </div>
      <pre id="viewer-prompt" tabindex="0"></pre>
    </div>
    </div>
    <div class="step">
      <button type="button" id="viewer-prev">← 이전</button>
      <button type="button" id="viewer-next">다음 →</button>
    </div>
  </div>
</dialog>

<!-- data.js를 고치면 v 값을 올려야 브라우저가 새로 받는다 -->
<script src="./data.js?v=43"></script>
<script>
(function () {
  var items = window.GALLERY || [];
  var grid = document.getElementById("grid");
  var viewer = document.getElementById("viewer");
  var copyBtn = document.getElementById("viewer-copy");
  var toggles = document.querySelectorAll(".toggle button[data-model]");
  var orders = document.querySelectorAll(".toggle button[data-order]");
  var shown = items;
  var current = -1;
  var model = "gpt";
  var order = "new";
  var promptText = "";

  try {
    if (localStorage.getItem("model") === "gemini") model = "gemini";
    var saved = localStorage.getItem("order");
    if (saved === "old" || saved === "name") order = saved;
  } catch (e) {}

  function sorted() {
    var list = items.slice();
    if (order === "name") {
      list.sort(function (a, b) { return a.name.localeCompare(b.name, "ko", { numeric: true }); });
    } else {
      list.sort(function (a, b) { return order === "old" ? a.n - b.n : b.n - a.n; });
    }
    return list;
  }

  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function thumb(it) { return "./thumbs/" + model + "/" + pad(it.n) + ".jpg"; }
  function full(it, which) { return encodeURI("./" + it.dir + "/" + it[which]); }
  // GitHub Pages는 .md를 .html로 변환해 올린다. 파일로 직접 열 때는 원본 .md로 간다.
  function docUrl(it) {
    var doc = location.protocol === "file:" ? it.doc : it.doc.replace(/\.md$/, ".html");
    return encodeURI("./" + it.dir + "/" + doc);
  }

  function render() {
    shown = sorted();
    grid.textContent = "";
    shown.forEach(function (it, i) {
      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.className = "card";
      btn.type = "button";
      btn.dataset.index = i;

      var img = document.createElement("img");
      img.src = thumb(it);
      img.alt = "";
      img.loading = "lazy";
      img.width = 600;
      img.height = 750;

      var text = document.createElement("div");
      text.className = "card-text";
      var no = document.createElement("span");
      no.className = "card-no";
      no.textContent = pad(it.n);
      var body = document.createElement("div");
      body.className = "card-body";
      var title = document.createElement("span");
      title.className = "card-title";
      title.textContent = it.name;
      var desc = document.createElement("span");
      desc.className = "card-desc";
      desc.textContent = it.desc;

      body.append(title, desc);
      text.append(no, body);
      btn.append(img, text);
      li.append(btn);
      grid.append(li);
    });
    toggles.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.model === model)); });
    orders.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.order === order)); });
  }

  function resetCopy() {
    copyBtn.textContent = "프롬프트 복사";
    copyBtn.classList.remove("done");
  }

  // 모델별로 프롬프트가 다른 항목은 버전을 골라 볼 수 있다.
  function showPrompt(it, pick) {
    var pre = document.getElementById("viewer-prompt");
    var box = document.getElementById("viewer-versions");
    var versions = it.prompts || [];
    var chosen = versions.filter(function (v) { return v.model === (pick || model); })[0] || versions[0];
    box.textContent = "";
    box.hidden = versions.length < 2;
    versions.forEach(function (v) {
      var b = document.createElement("button");
      b.type = "button";
      b.dataset.version = v.model;
      b.textContent = v.label;
      b.setAttribute("aria-pressed", String(v === chosen));
      b.addEventListener("click", function () {
        showPrompt(it, v.model);
        resetCopy();
      });
      box.append(b);
    });
    promptText = chosen ? chosen.text : it.prompt;
    pre.textContent = promptText;
    pre.scrollTop = 0;
  }

  function show(i) {
    var n = shown.length;
    if (!n) return;
    current = (i + n) % n;
    var it = shown[current];
    document.getElementById("viewer-no").textContent = pad(it.n);
    document.getElementById("viewer-title").textContent = it.name;
    var gpt = document.getElementById("viewer-gpt");
    var gemini = document.getElementById("viewer-gemini");
    // 한쪽 모델 결과가 없는 항목은 있는 쪽만 보여준다.
    [[gpt, "gpt", "GPT"], [gemini, "gemini", "Gemini"]].forEach(function (m) {
      var has = Boolean(it[m[1]]);
      m[0].closest("figure").hidden = !has;
      if (has) {
        m[0].src = full(it, m[1]);
        m[0].alt = it.name + " " + m[2] + " 결과";
      } else {
        m[0].removeAttribute("src");
      }
    });
    gpt.closest(".pair").classList.toggle("single", !(it.gpt && it.gemini));
    showPrompt(it);
    document.getElementById("viewer-link").href = docUrl(it);
    resetCopy();
    if (!viewer.open) viewer.showModal();
    history.replaceState(null, "", "#" + it.n);
  }

  // 주소 끝의 #번호로 해당 프롬프트를 바로 연다.
  function openFromHash() {
    var n = Number(location.hash.slice(1));
    var i = shown.findIndex(function (it) { return it.n === n; });
    if (i !== -1) show(i);
  }

  grid.addEventListener("click", function (e) {
    var btn = e.target.closest(".card");
    if (btn) show(Number(btn.dataset.index));
  });
  toggles.forEach(function (b) {
    b.addEventListener("click", function () {
      model = b.dataset.model;
      try { localStorage.setItem("model", model); } catch (e) {}
      render();
    });
  });
  orders.forEach(function (b) {
    b.addEventListener("click", function () {
      order = b.dataset.order;
      try { localStorage.setItem("order", order); } catch (e) {}
      render();
    });
  });
  copyBtn.addEventListener("click", function () {
    var text = promptText;
    var done = function () {
      copyBtn.textContent = "복사됨";
      copyBtn.classList.add("done");
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () {
        copyBtn.textContent = "복사하지 못했습니다. 직접 선택해 복사하세요";
      });
    } else {
      copyBtn.textContent = "복사하지 못했습니다. 직접 선택해 복사하세요";
    }
  });
  document.getElementById("viewer-close").addEventListener("click", function () { viewer.close(); });
  document.getElementById("viewer-prev").addEventListener("click", function () { show(current - 1); });
  document.getElementById("viewer-next").addEventListener("click", function () { show(current + 1); });
  viewer.addEventListener("click", function (e) { if (e.target === viewer) viewer.close(); });
  viewer.addEventListener("close", function () {
    history.replaceState(null, "", location.pathname + location.search);
  });
  viewer.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") show(current - 1);
    if (e.key === "ArrowRight") show(current + 1);
  });

  document.getElementById("count").textContent = pad(items.length) + " Prompts";
  render();
  openFromHash();
})();
</script>
</body>
</html>
